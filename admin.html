<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मुफ्ती उज़ैर एकेडमी - एडमिन पैनल</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: #fff; padding: 25px; margin: auto; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #1e3c72; text-align: center; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #333; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; margin-top: 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        #adminPanel, #loginBox { display: none; }
        .login-container { max-width: 400px; margin: auto; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- लॉगिन बॉक्स -->
    <div id="loginBox" class="login-container">
        <h2>🔐 एडमिन लॉगिन</h2>
        <label>गुप्त पासवर्ड दर्ज करें:</label>
        <input type="password" id="adminPass" placeholder="पासवर्ड लिखें...">
        <button onclick="checkPassword()">लॉगिन करें</button>
        <p id="loginError" style="color: red; margin-top: 10px; font-weight: bold;"></p>
    </div>

    <!-- कोर्स और वीडियो अपलोड करने का पैनल -->
    <div id="adminPanel">
        <h2>📚 नया कोर्स और वीडियो अपलोड करें</h2>
        <form id="courseForm">
            <label>कोर्स का नाम:</label>
            <input type="text" id="courseTitle" required placeholder="जैसे: तर्जुमा-ए-कुरान कोर्स">

            <label>कोर्स का विवरण (Description):</label>
            <textarea id="courseDesc" rows="3" required placeholder="कोर्स के बारे में जानकारी लिखें..."></textarea>

            <label>कोर्स की फीस:</label>
            <input type="text" id="coursePrice" required placeholder="जैसे: ₹500 या फ्री">

            <label>वीडियो का लिंक (MP4 वीडियो या सीधा लिंक):</label>
            <input type="url" id="courseVideo" placeholder="यहाँ वीडियो का डायरेक्ट लिंक डालें...">

            <label>पीडीएफ नोट्स / पढ़ाई का मटीरियल लिंक:</label>
            <input type="url" id="courseNotes" placeholder="यहाँ नोट्स का लिंक डालें...">

            <button type="submit">कोर्स और मटीरियल पब्लिश करें</button>
        </form>
        <p id="statusMsg" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4h47xTukc6Jm7gymW4pQeZmUjbLRPF8",
        authDomain: "mufti-uzair-academy.firebaseapp.com",
        projectId: "mufti-uzair-academy",
        storageBucket: "mufti-uzair-academy.firebasestorage.app",
        messagingSenderId: "569334821978",
        appId: "1:569334821978:web:f0054458844d4a83843d63"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.checkPassword = function() {
        const pass = document.getElementById('adminPass').value;
        if (pass === "uzair786saddamtechsolution") {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            sessionStorage.setItem('isAdminLoggedIn', 'true');
        } else {
            document.getElementById('loginError').innerText = "❌ गलत पासवर्ड!";
        }
    }

    if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
    } else {
        document.getElementById('loginBox').style.display = 'block';
    }

    const courseForm = document.getElementById('courseForm');
    courseForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('statusMsg');
        status.style.color = "blue";
        status.innerText = "अपलोड हो रहा है...";

        const title = document.getElementById('courseTitle').value;
        const description = document.getElementById('courseDesc').value;
        const price = document.getElementById('coursePrice').value;
        const videoUrl = document.getElementById('courseVideo').value;
        const notesUrl = document.getElementById('courseNotes').value;

        try {
            await addDoc(collection(db, "courses"), {
                title, description, price, videoUrl, notesUrl, createdAt: new Date()
            });
            status.style.color = "green";
            status.innerText = "✅ कोर्स और वीडियो सफलतापूर्वक अपलोड हो गया!";
            courseForm.reset();
        } catch (error) {
            status.style.color = "red";
            status.innerText = "❌ एरर: " + error.message;
        }
    });
</script>

</body>
</html>
