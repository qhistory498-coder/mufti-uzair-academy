<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मुफ्ती उज़ैर एकेडमी - कोर्सेज और वीडियो क्लासेज</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #1e3c72; }
        .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .course-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-top: 4px solid #1e3c72; }
        .course-title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .course-desc { color: #666; font-size: 14px; margin-bottom: 15px; }
        .course-price { font-size: 18px; font-weight: bold; color: #d9534f; margin-bottom: 15px; }
        
        /* Video Player inside card */
        video { width: 100%; max-height: 180px; background: #000; border-radius: 5px; margin-bottom: 10px; }
        
        .material-btn { display: block; background: #17a2b8; color: white; text-align: center; padding: 8px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-bottom: 10px; font-size: 14px; }
        .material-btn:hover { background: #138496; }
        
        .buy-btn { background: #007bff; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .buy-btn:hover { background: #0056b3; }
        #loading { text-align: center; font-size: 18px; color: #666; margin-top: 30px; }
        
        /* Modal Popup */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal-content label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .modal-btn { background: #28a745; color: white; border: none; padding: 10px; width: 100%; margin-top: 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .close-btn { background: #dc3545; margin-top: 8px; }
    </style>
</head>
<body>
<button id="themeToggleBtn" class="theme-toggle-btn">🌙 Dark Mode</button>
    
<h1>📖 मुफ्ती उज़ैर एकेडमी - कोर्सेज और वीडियो लेक्चर्स</h1>
<p id="loading">कोर्सेज लोड हो रहे हैं...</p>
<div class="course-grid" id="courseContainer"></div>

<!-- Enrollment Modal -->
<div id="enrollModal" class="modal">
    <div class="modal-content">
        <h3>📝 कोर्स के लिए आवेदन फॉर्म</h3>
        <p id="modalCourseTitle" style="font-weight: bold; color: #555;"></p>
        <form id="enrollForm">
            <label>छात्र का पूरा नाम:</label>
            <input type="text" id="studentName" required placeholder="अपना पूरा नाम लिखें">

            <label>मोबाइल नंबर (WhatsApp):</label>
            <input type="tel" id="studentPhone" required placeholder="अपना फोन नंबर लिखें">

            <label>पूरा पता (Address / शहर):</label>
            <textarea id="studentAddress" rows="3" required placeholder="अपना पूरा पता लिखें..."></textarea>

            <button type="submit" class="modal-btn">दाखिला सुरक्षित करें</button>
            <button type="button" class="modal-btn close-btn" onclick="closeModal()">रद्द करें</button>
        </form>
        <p id="enrollStatus" style="text-align: center; margin-top: 10px; font-weight: bold;"></p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA4h47xTukc6Jm7gymW4pQeZmUjbLRPF8",
        authDomain: "mufti-uzair-academy.firebaseapp.com",
        projectId: "mufti-uzair-academy",
        storageBucket: "mufti-uzair-academy.firebasestorage.app",
        messagingSenderId: "569334821978",
        appId: "1:569334821978:web:f0054458844d4a83843d63"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let selectedCourseName = "";

    async function loadCourses() {
        const container = document.getElementById('courseContainer');
        const loading = document.getElementById('loading');
        
        try {
            const querySnapshot = await getDocs(collection(db, "courses"));
            loading.style.display = 'none';

            if (querySnapshot.empty) {
                container.innerHTML = "<p style='text-align:center; width:100%;'>अभी कोई कोर्स उपलब्ध नहीं है।</p>";
                return;
            }

            querySnapshot.forEach((doc) => {
                const course = doc.data();
                const card = document.createElement('div');
                card.className = 'course-card';

                // वीडियो दिखाने का हिस्सा (अगर वीडियो लिंक डाला गया है)
                let videoSection = course.videoUrl ? `<video controls src="${course.videoUrl}"></video>` : `<p style="color:#888; font-size:13px; text-align:center;">(वीडियो जल्द उपलब्ध होगा)</p>`;
                
                // नोट्स डाउनलोड/देखने का हिस्सा (अगर नोट्स लिंक डाला गया है)
                let notesSection = course.notesUrl ? `<a href="${course.notesUrl}" target="_blank" class="material-btn">📄 पीडीएफ नोट्स डाउनलोड करें</a>` : "";

                card.innerHTML = `
                    <div class="course-title">${course.title}</div>
                    <div class="course-desc">${course.description}</div>
                    ${videoSection}
                    ${notesSection}
                    <div class="course-price">फीस: ${course.price}</div>
                    <button class="buy-btn" onclick="openEnrollModal('${course.title.replace(/'/g, "\\'")}')">अभी दाखिला लें (Enroll)</button>
                `;
                container.appendChild(card);
            });
        } catch (error) {
            loading.innerText = "लोड करने में समस्या: " + error.message;
        }
    }

    window.openEnrollModal = function(courseTitle) {
        selectedCourseName = courseTitle;
        document.getElementById('modalCourseTitle').innerText = "कोर्स: " + courseTitle;
        document.getElementById('enrollModal').style.display = 'flex';
        document.getElementById('enrollStatus').innerText = "";
        document.getElementById('enrollForm').reset();
    }

    window.closeModal = function() {
        document.getElementById('enrollModal').style.display = 'none';
    }

    const enrollForm = document.getElementById('enrollForm');
    enrollForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusText = document.getElementById('enrollStatus');
        statusText.style.color = "blue";
        statusText.innerText = "डेटा सेव हो रहा है...";

        const name = document.getElementById('studentName').value;
        const phone = document.getElementById('studentPhone').value;
        const address = document.getElementById('studentAddress').value;

        try {
            await addDoc(collection(db, "enrollments"), {
                courseName: selectedCourseName,
                studentName: name,
                studentPhone: phone,
                studentAddress: address,
                enrolledAt: new Date()
            });
            statusText.style.color = "green";
            statusText.innerText = "✅ आवेदन जमा हो गया! मुफ्ती साहब जल्द संपर्क करेंगे।";
            setTimeout(() => { closeModal(); }, 2500);
        } catch (error) {
            statusText.style.color = "red";
            statusText.innerText = "❌ एरर: " + error.message;
        }
    });

    loadCourses();
</script>

</body>
</html>
