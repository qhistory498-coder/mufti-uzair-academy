<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Live Class - Mufti Uzair Academy</title>
    <!-- Google Fonts for World-Class Look -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Nastaliq+Urdu:wght@700&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Link to our External CSS File -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Special Styling for Integrated Video Room */
        .video-container {
            width: 100%;
            max-width: 1000px;
            height: 600px;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: #000;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .live-instruction {
            text-align: center;
            margin-bottom: 15px;
            color: #334155;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">Mufti Uzair Academy</div>
        <div class="nav-container">
            <nav>
                <a href="index.html" id="nav-home">होम</a>
                <a href="courses.html" id="nav-courses">कोर्सेज</a>
                <a href="live.html" class="active" style="color: #fbbf24;" id="nav-live">लाइव क्लास</a>
                <a href="faq.html" id="nav-faq">सवाल-जवाब</a>
                <a href="contact.html" id="nav-contact">सम्पर्क</a>
            </nav>
            <!-- Language Switcher Dropdown -->
            <select class="lang-select" onchange="changeLanguage(this.value)">
                <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
                <option value="en">🇬🇧 English</option>
                <option value="ur">🇵🇰 اردو (Urdu)</option>
            </select>
        </div>
    </header>

    <!-- Page Banner -->
    <section class="page-banner">
        <h1 id="banner-title">लाइव क्लासरूम</h1>
        <div class="urdu-subtitle">لائیو کلاس روم</div>
    </section>

    <!-- Live Video Integration Section -->
    <div class="container">
        <div class="live-instruction">
            <p>मुफ्ती उज़ैर साहब की लाइव क्लास अब सीधे यहाँ देखें। अपना कैमरा और माइक ऑन करके क्लास में शामिल हों।</p>
        </div>
        
        <!-- Embedded Live Video Room -->
        <div class="video-container">
            <iframe src="https://meet.jit.si/MuftiUzairAcademyLiveClass" allow="camera; microphone; fullscreen; display-capture; autoplay"></iframe>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p id="footer-text">&copy; 2026 Mufti Uzair Online Academy. All Rights Reserved.</p>
    </footer>

    <!-- Link to our External JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
