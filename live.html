<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मुफ्ती उज़ैर एकेडमी - ज़ूम जैसा लाइव क्लास रूम</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e3c72; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 18px; }
        #meet-container { flex: 1; width: 100%; background: #111; }
        .top-bar { padding: 10px 20px; background: #fff; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .room-input { padding: 8px 12px; width: 250px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .name-input { padding: 8px 12px; width: 180px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .join-btn { padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .join-btn:hover { background: #218838; }
    </style>
</head>
<body>

<header>
    <h1>🎥 मुफ्ती उज़ैर एकेडमी - लाइव क्लास रूम</h1>
    <span style="font-size: 13px; background: #ffc107; color: #000; padding: 3px 8px; border-radius: 3px; font-weight: bold;">लाइव एचडी क्लास</span>
</header>

<div class="top-bar">
    <label style="font-size: 14px; font-weight: bold;">आपका नाम:</label>
    <input type="text" id="userNameInput" class="name-input" placeholder="अपना नाम लिखें...">
    
    <label style="font-size: 14px; font-weight: bold;">क्लास रूम:</label>
    <input type="text" id="roomNameInput" class="room-input" value="MuftiUzairLiveClass">
    
    <button class="join-btn" onclick="startMeeting()">क्लास शुरू करें / जुड़ें</button>
</div>

<!-- ज़ूम जैसी वीडियो मीटिंग दिखाने की मुख्य जगह -->
<div id="meet-container"></div>

<!-- Jitsi Meet External API Library (Zoom Features Provider) -->
<script src="https://8x8.vc/vpaas-magic-cookie-95146c6ae8e8477f805a5a1f6aa44e40/external_api.js"></script>
<script>
    let api = null;

    function startMeeting() {
        const roomName = document.getElementById('roomNameInput').value.trim() || "MuftiUzairLiveClass";
        const userName = document.getElementById('userNameInput').value.trim() || "Student / Guest";
        
        // पुरानी मीटिंग बंद करें अगर चल रही हो
        if (api != null) {
            api.dispose();
        }

        const domain = "8x8.vc";
        const options = {
            roomName: "vpaas-magic-cookie-95146c6ae8e8477f805a5a1f6aa44e40/" + roomName,
            width: "100%",
            height: "100%",
            parentNode: document.querySelector('#meet-container'),
            userInfo: {
                displayName: userName
            },
            configOverwrite: {
                startWithAudioMuted: false,
                startWithVideoMuted: false,
                prejoinPageEnabled: false,
                disableInviteFunctions: true
            },
            interfaceConfigOverwrite: {
                // ज़ूम जैसे सारे टूल्स (चैट, स्क्रीन शेयर, हैंड रेज, म्यूट बटन आदि) स्क्रीन पर दिखाई देंगे
                TOOLBAR_BUTTONS: [
                    'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
                    'fodeviceselection', 'hangup', 'profile', 'chat', 'recording',
                    'livestreaming', 'etherpad', 'sharedvideo', 'settings', 'raisehand',
                    'videoquality', 'filmstrip', 'stats', 'shortcuts', 'tileview'
                ],
                SHOW_JITSI_WATERMARK: false,
                DEFAULT_REMOTE_DISPLAY_NAME: "Mufti Uzair Academy Member"
            }
        };

        api = new JitsiMeetExternalAPI(domain, options);
    }

    // पेज खुलते ही डिफ़ॉल्ट क्लास रूम लोड हो जाएगा
    window.onload = function() {
        // डिफ़ॉल्ट नाम सेट कर सकते हैं
        document.getElementById('userNameInput').value = "सद्दाम / छात्र";
        startMeeting();
    };
</script>

</body>
</html>
